#abbey-gate .g-title{font-family:Georgia,'Cormorant Garamond',serif;font-style:italic;font-size:34px;font-weight:400;color:#ffffff;margin:0 0 8px;line-height:1.15}

@keyframes abbey-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#abbey-gate.shake .g-card{animation:abbey-shake .4s}

<script id="abbey-gate-js">
(function(){
  var KEY='abbey_unlocked_v1'; var CODE='abbey333';
  try{ if(localStorage.getItem(KEY)==='true') return; }catch(e){}
  var params=new URLSearchParams(location.search);
  if(params.get('logout')==='1'){ try{localStorage.removeItem(KEY);}catch(e){}}
  document.addEventListener('DOMContentLoaded',function(){
    var el=document.createElement('div');
    el.id='abbey-gate';
    el.innerHTML='<div class="g-card"><div class="g-brand">Candid Captures · Abbey</div><h1 class="g-title">welcome, Abbey.</h1><p class="g-sub">Sign in to your hub</p><input id="abbey-pw" type="password" placeholder="Passphrase" autocomplete="off" autofocus><button id="abbey-btn">Unlock</button><div class="g-err" id="abbey-err"></div><div class="g-foot">Powered by Earthed · Cyborg V1</div></div>';
    document.body.appendChild(el);
    var input=document.getElementById('abbey-pw');
    var btn=document.getElementById('abbey-btn');
    var err=document.getElementById('abbey-err');
    function tryUnlock(){
      if(input.value===CODE){
        try{localStorage.setItem(KEY,'true');}catch(e){}
        el.remove();
      } else {
        err.textContent='Nope — try again';
        el.classList.add('shake');
        input.value=''; input.focus();
        setTimeout(function(){el.classList.remove('shake');},400);
      }
    }
    btn.addEventListener('click',tryUnlock);
    input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();tryUnlock();}});
  });
})();
</script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nge: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Work Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"804d5bb2-b8dd-4117-a6d5-a0b23df75342\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html,body{margin:0;padding:0;background:#14110E;}\n  *{box-sizing:border-box;}\n  a{color:#B39F82;text-decoration:none;}\n  a:hover{color:#EDE5D8;}\n  input,textarea{font-family:inherit;}\n  input:focus,textarea:focus{outline:1px solid #7A7857;}\n  ::placeholder{color:#5C554A;opacity:1;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#14110E;color:#EDE5D8;font-family:'Work Sans',sans-serif;font-size:15px;\">\n\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:34px 48px 0 48px;flex-wrap:wrap;\">\n    <div>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:3px;color:#A29889;text-transform:uppercase;\">Candid Captures · Adelaide · Abbey Molina<\u002Fdiv>\n      <div style=\"font-family:'Playfair Display',serif;font-size:44px;line-height:1.05;margin-top:10px;\">The <em style=\"font-weight:500;\">whole picture<\u002Fem>.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:2px;color:#A29889;text-transform:uppercase;padding-bottom:10px;\">Sole trader → Pty Ltd · saves automatically as you type<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:4px;padding:26px 48px 0 48px;border-bottom:1px solid #2B2620;flex-wrap:wrap;\">\n    <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"6\">\n      <button sc-camel-on-click=\"{{ setTab }}\" data-tab=\"{{ $index }}\" style=\"{{ t.style }}\">{{ t.num }}&nbsp;&nbsp;{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- ════ 01 · THE PLAN ════ -->\n  <sc-if value=\"{{ showPlan }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"padding:40px 48px 80px 48px;max-width:1240px;margin:0 auto;\">\n    <div style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:start;\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:3px;color:#7A7857;text-transform:uppercase;\">✦ &nbsp;The north star<\u002Fdiv>\n        <div style=\"font-family:'Playfair Display',serif;font-size:34px;line-height:1.2;margin-top:14px;\">Candid Captures SA <em>Pty Ltd<\u002Fem>, registered by <span style=\"border-bottom:2px solid #7A7857;\">31 Oct 2026<\u002Fspan> — with money calm on both sides of life.<\u002Fdiv>\n        <div style=\"color:#B3AA9B;line-height:1.7;margin-top:16px;font-size:14px;\">One hub for everything: business income, personal bills, health, car, and the cashflow between them. Ten minutes on a Sunday keeps it true.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n        <sc-for list=\"{{ goalTiles }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"background:#1D1915;border:1px solid #2B2620;padding:18px 18px 16px 18px;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:#A29889;text-transform:uppercase;\">{{ g.label }}<\u002Fdiv>\n            <div style=\"font-family:'Playfair Display',serif;font-size:27px;margin-top:8px;color:{{ g.color }};\">{{ g.value }}<\u002Fdiv>\n            <div style=\"height:3px;background:#2B2620;margin-top:12px;position:relative;\"><div style=\"{{ g.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:11px;color:#8A8172;margin-top:8px;\">{{ g.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:56px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:3px;color:#7A7857;text-transform:uppercase;\">✦ &nbsp;The next 90 days<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:18px;\">\n        <sc-for list=\"{{ phases }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"background:#1D1915;border:1px solid #2B2620;border-top:2px solid {{ p.accent }};padding:20px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;\">\n              <div style=\"font-family:'Playfair Display',serif;font-size:21px;\">{{ p.title }}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:#A29889;\">{{ p.range }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;color:{{ p.accent }};margin-top:4px;letter-spacing:1px;\">{{ p.progress }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:14px;\">\n              <sc-for list=\"{{ p.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;gap:10px;font-size:13px;line-height:1.5;color:{{ it.color }};\"><span>{{ it.mark }}<\u002Fspan><span style=\"{{ it.textStyle }}\">{{ it.text }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:56px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:3px;color:#7A7857;text-transform:uppercase;\">✦ &nbsp;The twelve-month arc<\u002Fdiv>\n      <div style=\"margin-top:26px;position:relative;height:120px;\">\n        <div style=\"position:absolute;left:0;right:0;top:58px;height:1px;background:#3A342C;\"><\u002Fdiv>\n        <sc-for list=\"{{ yearMarks }}\" as=\"m\" hint-placeholder-count=\"7\">\n          <div style=\"position:absolute;top:0;left:{{ m.left }};width:130px;margin-left:-65px;text-align:center;\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:#A29889;\">{{ m.month }}<\u002Fdiv>\n            <div style=\"width:9px;height:9px;border-radius:50%;background:{{ m.dot }};border:1px solid {{ m.ring }};margin:12px auto 0 auto;position:relative;top:1px;\"><\u002Fdiv>\n            <div style=\"font-size:11px;color:{{ m.textColor }};margin-top:14px;line-height:1.45;\">{{ m.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px;display:grid;grid-template-columns:1fr 1fr;gap:48px;\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:3px;color:#7A7857;text-transform:uppercase;\">✦ &nbsp;Ideas parking lot<\u002Fdiv>\n        <div style=\"color:#8A8172;font-size:13px;margin-top:8px;\">Anything on your mind — shoots, offers, admin. Park it here so it stops circling.<\u002Fdiv>\n        <div style=\"display:flex;gap:8px;margin-top:16px;\">\n          <input value=\"{{ ideaDraft }}\" sc-camel-on-change=\"{{ onIdeaDraft }}\" sc-camel-on-key-down=\"{{ onIdeaKey }}\" placeholder=\"e.g. Mini sessions weekend in the Adelaide Hills…\" style=\"flex:1;background:#1D1915;border:1px solid #2B2620;color:#EDE5D8;padding:11px 14px;font-size:14px;\">\n          <button sc-camel-on-click=\"{{ addIdea }}\" style=\"background:#7A7857;border:none;color:#14110E;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:2px;padding:0 20px;cursor:pointer;text-transform:uppercase;\">Park it<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px;\">\n          <sc-for list=\"{{ ideas }}\" as=\"idea\" hint-placeholder-coun n:right;width:100%;\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr;border-bottom:1px solid #2B2620;background:#211D18;font-size:14px;\">\n        <div style=\"padding:12px 8px 12px 20px;letter-spacing:1px;color:#C9A08A;font-size:11px;text-transform:uppercase;\">Total expenses<\u002Fdiv>\n        <div style=\"padding:12px 20px 12px 8px;text-align:right;color:#C9A08A;\">{{ fcExpTotal0 }}<\u002Fdiv>\n        <div style=\"padding:12px 20px 12px 8px;text-align:right;color:#C9A08A;\">{{ fcExpTotal1 }}<\u002Fdiv>\n        <div style=\"padding:12px 20px 12px 8px;text-align:right;color:#C9A08A;\">{{ fcExpTotal2 }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr;background:#242019;font-family:'Playfair Display',serif;font-size:20px;\">\n        <div style=\"padding:16px 8px 16px 20px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:2px;color:#EDE5D8;text-transform:uppercase;align-self:center;\">Net · what's left<\u002Fdiv>\n        <div style=\"padding:14px 20px;text-align:right;color:{{ fcNetColor0 }};\">{{ fcNet0 }}<\u002Fdiv>\n        <div style=\"padding:14px 20px;text-align:right;color:{{ fcNetColor1 }};\">{{ fcNet1 }}<\u002Fdiv>\n        <div style=\"padding:14px 20px;text-align:right;color:{{ fcNetColor2 }};\">{{ fcNet2 }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:28px;margin-top:18px;color:#8A8172;font-size:13px;line-height:1.6;flex-wrap:wrap;\">\n      <div style=\"flex:1;min-width:220px;\">✦ &nbsp;The Pty Ltd fund line quietly saves $500/mo toward registration.<\u002Fdiv>\n      <div style=\"flex:1;min-width:220px;\">✦ &nbsp;GST reserve is a rough 10% set-aside — keep that cash separate.<\u002Fdiv>\n      <div style=\"flex:1;min-width:220px;\">✦ &nbsp;These are a starting picture. Overwrite with your reality.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ════ 06 · PTY LTD ════ -->\n  <sc-if value=\"{{ showPty }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:40px 48px 80px 48px;max-width:1240px;margin:0 auto;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;\">\n      <div>\n        <div style=\"font-family:'Playfair Display',serif;font-size:30px;\">Candid Captures SA <em>Pty Ltd<\u002Fem>.<\u002Fdiv>\n        <div style=\"color:#B3AA9B;font-size:14px;margin-top:6px;\">A calm 90-day path from sole trader to company. Tick as you go.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:36px;text-align:right;\">\n        <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:#A29889;text-transform:uppercase;\">Setup · one-off<\u002Fdiv><div style=\"font-family:'Playfair Display',serif;font-size:24px;\">{{ setupCost }}<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:#A29889;text-transform:uppercase;\">Ongoing · yr 1<\u002Fdiv><div style=\"font-family:'Playfair Display',serif;font-size:24px;\">{{ ongoingCost }}<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:#A29889;text-transform:uppercase;\">Done<\u002Fdiv><div style=\"font-family:'Playfair Display',serif;font-size:24px;color:#A6B08E;\">{{ taskProgressBig }}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:24px;border:1px solid #2B2620;background:#1D1915;\">\n      <sc-for list=\"{{ taskRows }}\" as=\"t\" hint-placeholder-count=\"11\">\n        <div style=\"{{ t.rowStyle }}\">\n          <button sc-camel-on-click=\"{{ toggleTask }}\" data-i=\"{{ t.idx }}\" style=\"{{ t.boxStyle }}\">{{ t.mark }}<\u002Fbutton>\n          <div style=\"width:80px;flex-shrink:0;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:{{ t.phaseColor }};text-transform:uppercase;\">{{ t.phase }}<\u002Fdiv>\n          <div style=\"width:90px;flex-shrink:0;font-size:11px;color:#A29889;\">{{ t.target }}<\u002Fdiv>\n          <div style=\"flex:1;font-size:14px;line-height:1.5;color:{{ t.taskColor }};\"><span style=\"{{ t.taskStyle }}\">{{ t.task }}<\u002Fspan><\u002Fdiv>\n          <div style=\"width:70px;flex-shrink:0;text-align:right;font-size:13px;color:#B39F82;\">{{ t.cost }}<\u002Fdiv>\n          <div style=\"flex:0.9;font-size:11px;color:#8A8172;line-height:1.5;\">{{ t.note }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;\">\n      <div style=\"background:#1D1915;border:1px solid #2B2620;padding:26px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:3px;color:#7A7857;text-transform:uppercase;\">✦ &nbsp;Ongoing costs, year 1<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;margin-top:14px;\">\n          <sc-for list=\"{{ ongoingRows }}\" as=\"o\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #26221C;font-size:13.5px;\">\n              <span style=\"color:#D8D0C2;\">{{ o.label }}<\u002Fspan><span style=\"color:#B39F82;\">{{ o.amount }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#1D1915;border:1px solid #2B2620;padding:26px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:3px;color:#7A7857;text-transform:uppercase;\">✦ &nbsp;Why make the jump<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:16px;font-size:13.5px;line-height:1.65;color:#D8D0C2;\">\n          <div><span style=\"color:#EDE5D8;\">Personal asset protection.<\u002Fspan> A Pty Ltd is a separate legal entity — a client claim can't reach your home or savings.<\u002Fdiv>\n          <div><span style=\"color:#EDE5D8;\">25% flat tax on retained profit.<\u002Fspan> Versus up to 45% at personal rates as a sole trader.<\u002Fdiv>\n          <div><span style=\"color:#EDE5D8;\">Bigger clients say yes.<\u002Fspan> Venues, agencies and brand partners prefer Pty Ltd suppliers.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"padding:24px 48px 40px 48px;border-top:1px solid #2B2620;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:#5C554A;text-transform:uppercase;flex-wrap:gap:12px;\">\n    <span>Candid Captures · business hub · v3<\u002Fspan>\n    <span>✦ &nbsp;Ten minutes on a Sunday<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#7A7857&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#7A7857&quot;, &quot;#B39F82&quot;, &quot;#5C6B4E&quot;, &quot;#8A6A4F&quot;], &quot;section&quot;: &quot;Look&quot;}, &quot;fundTarget&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 1500, &quot;tsType&quot;: &quot;number&quot;, &quot;min&quot;: 500, &quot;max&quot;: 10000, &quot;step&quot;: 100, &quot;section&quot;: &quot;Goals&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = {\n      tab: 0, ideaDraft: '',\n      ideas: [\n        { text: 'Mini sessions weekend — Adelaide Hills, spring light' },\n        { text: 'Pitch The Monthly to 3 past family clients' },\n      ],\n      moneyIn: [\n        { date: '01 Jul 26', client: 'Sample — standard shoot', pkg: 'Standard Session', amount: '280', paid: true, notes: 'Overwrite with your first one' },\n        { date: '05 Jul 26', client: 'Sample — monthly member', pkg: 'The Monthly', amount: '120', paid: true, notes: 'Recurring subscription' },\n      ],\n      moneyOut: [\n        { date: '01 Jul 26', desc: 'Rent', amount: '550', side: 'Personal', cat: 'Housing', notes: '' },\n        { date: '01 Jul 26', desc: 'Groceries', amount: '220', side: 'Personal', cat: 'Food', notes: '' },\n        { date: '03 Jul 26', desc: 'Adobe Creative Cloud', amount: '89', side: 'Business', cat: 'Software', notes: 'Editing' },\n        { date: '05 Jul 26', desc: 'Google Workspace', amount: '8.40', side: 'Business', cat: 'Software', notes: 'Email + Drive' },\n        { date: '07 Jul 26', desc: 'Phone bill', amount: '65', side: 'Personal', cat: 'Utilities', notes: '' },\n        { date: '08 Jul 26', desc: 'Public liability insurance', amount: '65', side: 'Business', cat: 'Insurance', notes: 'Monthly instalment' },\n        { date: '10 Jul 26', desc: 'Petrol', amount: '80', side: 'Personal', cat: 'Car', notes: '' },\n        { date: '12 Jul 26', desc: 'Coffee + food out', amount: '95', side: 'Personal', cat: 'Discretionary', notes: '' },\n        { date: '14 Jul 26', desc: 'Camera cleaning kit', amount: '45', side: 'Business', cat: 'Gear', notes: '' },\n        { date: '15 Jul 26', desc: 'Netflix / Spotify', amount: '30', side: 'Personal', cat: 'Subscriptions', notes: '' },\n      ],\n      fcIncome: [\n        { label: 'The Monthly subscribers', m: [720, 960, 1200] },\n        { label: 'One-off sessions', m: [1500, 2000, 2500] },\n        { label: 'Wedding bookings', m: [0, 890, 1890] },\n        { label: 'Branding shoots', m: [380, 780, 780] },\n      ],\n      fcExpense: [\n        { label: 'Personal bills (rent, food, car, utilities)', m: [2500, 2500, 2500] },\n        { label: 'Health (gym, appointments, scripts)', m: [120, 120, 120] },\n        { label: 'Business software + insurance', m: [200, 200, 200] },\n        { label: 'Gear + supplies (~5% of income)', m: [130, 190, 260] },\n        { label: 'Marketing / IG boosts', m: [100, 150, 200] },\n        { label: 'Pty Ltd fund set-aside', m: [500, 500, 500] },\n        { label: 'GST reserve (~10% of income)', m: [260, 460, 640] },\n      ],\n      tasks: [\n        { phase: 'Month 1', target: '20 Jul', task: 'Open a separate Candid Captures business bank account', cost: '', done: false, note: 'Free with most banks' },\n        { phase: 'Month 1', target: '25 Jul', task: 'Start using Xero — cashbook plan for now', cost: '$35/mo', done: false, note: 'Upgrade when Pty Ltd is live' },\n        { phase: 'Month 1', target: '30 Jul', task: 'Move all business expenses onto the new account', cost: '', done: false, note: 'Clean records = cheap accountant time' },\n        { phase: 'Month 1', target: '04 Aug', task: 'Fill in this hub weekly (10 mins Sunday)', cost: '', done: false, note: 'Build the habit' },\n        { phase: 'Month 1', target: '09 Aug', task: 'Check GST registration (only if turnover projects >$75k)', cost: '', done: false, note: 'abr.business.gov.au' },\n        { phase: 'Month 2', target: '19 Aug', task: 'Check company name availability on ASIC Connect', cost: '', done: false, note: \"Aim: 'Candid Captures SA Pty Ltd'\" },\n        { phase: 'Month 2', target: '24 Aug', task: 'Apply for your Director ID at abrs.gov.au', cost: 'Free', done: false, note: 'Mandatory before registering · 10 mins' },\n        { phase: 'Month 2', target: '23 Sep', task: 'Get 2–3 quotes from small-business accountants', cost: '', done: false, note: 'Pick the one who talks like a human' },\n        { phase: 'Month 3', target: '23 Sep', task: 'Register the Pty Ltd via ASIC (Form 201)', cost: '$597', done: false, note: 'ASIC fee as at July 2026' },\n        { phase: 'Month 3', target: '28 Sep', task: 'New bank account under Pty Ltd name + transfer balance', cost: '', done: false, note: 'Takes 30 mins' },\n        { phase: 'Month 3', target: '08 Oct', task: 'Update Xero + invoices to the new Pty Ltd ABN', cost: '', done: false, note: 'Email suppliers — they update their end' },\n      ],\n    };\n    try {\n      const saved = JSON.parse(localStorage.getItem('cc-hub-v3'));\n      if (saved && saved.moneyIn) this.state = Object.assign({}, this.state, saved, { tab: saved.tab || 0 });\n    } catch (e) {}\n  }\n  save() {\n    const { tab, ideaDraft, ideas, moneyIn, moneyOut, fcIncome, fcExpense, tasks } = this.state;\n    try { localStorage.setItem('cc-hub-v3', JSON.stringify({ tab, ideas, moneyIn, moneyOut, fcIncome, fcExpense, tasks })); } catch (e) {}\n  }\n  set(patch) { this.setState(patch, () => this.save()); }\n  money(n) {\n    const v = Math.round(n);\n    const s = '$' + Math.abs(v).toLocaleString('en-AU');\n    return v < 0 ? '−' + s : s;\n  }\n  renderVals() {\n    const S = this.state;\n    const accent = this.props.accent ?? '#7A7857';\n    const fundTarget = this.props.fundTarget ?? 1500;\n    const num = (x) => { const n = parseFloat(String(x).replace(/[^0-9.\\-]/g, '')); return isNaN(n) ? 0 : n; };\n    const totalIn = S.moneyIn.reduce((a, r) => a + num(r.amount), 0);\n    const totalOut = S.moneyOut.reduce((a, r) => a + num(r.amount), 0);\n    const outPersonalN = S.moneyOut.filter(r => r.side === 'Personal').reduce((a, r) => a + num(r.amount), 0);\n    const outBusinessN = totalOut - outPersonalN;\n    const net = totalIn - totalOut;\n    const fund = Math.max(0, Math.min(net, fundTarget));\n    const incT = [0, 1, 2].map(i => S.fcIncome.reduce((a, r) => a + num(r.m[i]), 0));\n    const expT = [0, 1, 2].map(i => S.fcExpense.reduce((a, r) => a + num(r.m[i]), 0));\n    const nets = [0, 1, 2].map(i => incT[i] - expT[i]);\n    const doneCount = S.tasks.filter(t => t.done).length;\n    const tabNames = ['The Plan', 'Overview', 'Money In', 'Money Out', 'Forecast', 'Pty Ltd'];\n    const tabs = tabNames.map((label, i) => ({\n      label, num: '0' + (i + 1),\n      style: `background:none;border:none;border-bottom:2px solid ${i === S.tab ? accent : 'transparent'};color:${i === S.tab ? '#EDE5D8' : '#A29889'};font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;padding:12px 18px;cursor:pointer;margin-bottom:-1px;`,\n    }));\n    const pct = (v, t) => Math.max(0, Math.min(100, Math.round(v / t * 100)));\n    const bar = (p, c) => `height:100%;width:${p}%;background:${c};`;\n    const monthlyMembers = S.moneyIn.filter(r => (r.pkg || '').toLowerCase().includes('monthly')).length;\n    const goalTiles = [\n      { label: 'Pty Ltd fund', value: this.money(fund), color: '#B39F82', sub: 'of ' + this.money(fundTarget) + ' setup cost', barStyle: bar(pct(fund, fundTarget), '#B39F82') },\n      { label: 'Checklist', value: doneCount + ' / ' + S.tasks.length, color: '#EDE5D8', sub: 'tasks ticked off', barStyle: bar(pct(doneCount, S.tasks.length), accent) },\n      { label: 'Net this cycle', value: this.money(net), color: net >= 0 ? '#A6B08E' : '#C9A08A', sub: 'money in minus everything out', barStyle: bar(pct(net, Math.max(totalIn, 1)), net >= 0 ? '#A6B08E' : '#C9A08A') },\n      { label: 'Monthly members', value: monthlyMembers + ' of 10', color: '#EDE5D8', sub: 'The Monthly — goal 10 by Dec', barStyle: bar(pct(monthlyMembers, 10), accent) },\n    ];\n    const phaseDefs = [['Month 1', 'Foundations', 'JUL – AUG'], ['Month 2', 'Paperwork', 'AUG – SEP'], ['Month 3', 'The jump', 'SEP – OCT']];\n    const phases = phaseDefs.map(([key, title, range], pi) => {\n      const items = S.tasks.filter(t => t.phase === key);\n      const done = items.filter(t => t.done).length;\n      return {\n        title, range, accent: pi === 2 ? '#B39F82' : accent,\n        progress: done + ' of ' + items.length + ' done',\n        items: items.map(t => ({\n          mark: t.done ? '✓' : '·', text: t.task,\n          color: t.done ? '#8A8172' : '#D8D0C2',\n          textStyle: t.done ? 'text-decoration:line-through;' : '',\n        })),\n      };\n    });\n    const yearMarks = [\n      { month: 'JUL 26', text: 'Hub live · bank account + Xero' },\n      { month: 'SEP 26', text: 'Director ID · name reserved' },\n      { month: 'OCT 26', text: 'Pty Ltd registered ✦', big: true },\n      { month: 'DEC 26', text: '10 Monthly members' },\n      { month: 'FEB 27', text: 'First BAS as a company' },\n      { month: 'APR 27', text: 'Review pricing + packages' },\n      { month: 'JUN 27', text: 'EOFY — first company year' },\n    ].map((m, i, arr) => ({\n      ...m, left: (4 + i * (92 / (arr.length - 1))) + '%',\n      dot: m.big ? '#B39F82' : '#14110E', ring: m.big ? '#B39F82' : '#8A8172',\n      textColor: m.big ? '#EDE5D8' : '#A29889',\n    }));\n    const rhythm = [\n      { when: 'Sunday', what: 'Ten minutes: log the week\\u2019s money in and out, glance at the overview.' },\n      { when: 'Monthly', what: 'First Sunday: update the forecast, move $500 to the Pty Ltd fund, pay yourself.' },\n      { when: 'Quarterly', what: 'BAS time (once GST-registered) — the GST reserve means it\\u2019s already sitting there.' },\n      { when: 'Any time', what: 'Idea strikes mid-shoot? Park it on this page and get back to the light.' },\n    ];\n    const statCards = [\n      { label: 'Money in', value: this.money(totalIn), color: '#A6B08E', sub: 'so far this cycle' },\n      { label: 'Money out', value: this.money(totalOut), color: '#C9A08A', sub: 'personal + business' },\n      { label: 'Net saved', value: this.money(net), color: net >= 0 ? '#EDE5D8' : '#C9A08A', sub: 'the gap you\\u2019re building' },\n      { label: 'Pty Ltd fund', value: this.money(fund), color: '#B39F82', sub: 'of ' + this.money(fundTarget) + ' — on the way' },\n    ];\n    const labels = ['AUG', 'SEP', 'OCT'];\n    const ninetyCards = nets.map((n, i) => ({\n      label: 'M' + (i + 1) + ' · ' + labels[i], value: this.money(n),\n      color: n >= 0 ? '#EDE5D8' : '#C9A08A', accent: accent,\n    })).concat([{ label: '3-month total', value: this.money(nets[0] + nets[1] + nets[2]), color: '#B39F82', accent: '#B39F82' }]);\n    const maxBar = Math.max(...incT, ...expT, 1);\n    const bars = [];\n    [0, 1, 2].forEach(i => {\n      bars.push({ label: labels[i] + ' in', h: Math.round(incT[i] / maxBar * 100) + '%', fill: accent });\n      bars.push({ label: 'out', h: Math.round(expT[i] / maxBar * 100) + '%', fill: '#3A342C' });\n    });\n    const catMap = {};\n    S.moneyOut.forEach(r => { const k = r.cat || 'Other'; catMap[k] = (catMap[k] || 0) + num(r.amount); });\n    const maxCat = Math.max(...Object.values(catMap), 1);\n    const catRows = Object.entries(catMap).sort((a, b) => b[1] - a[1]).slice(0, 6)\n      .map(([label, v]) => ({ label, amount: this.money(v), barStyle: bar(Math.round(v / maxCat * 100), '#B39F82') }));\n    const activity = [\n      ...S.moneyIn.map(r => ({ date: r.date, desc: r.client, amount: this.money(num(r.amount)), sign: '+', color: '#A6B08E' })),\n      ...S.moneyOut.map(r => ({ date: r.date, desc: r.desc, amount: this.money(num(r.amount)), sign: '−', color: '#C9A08A' })),\n    ].slice(-7).reverse();\n    const nextT = S.tasks.find(t => !t.done);\n    const mk = (r, i) => ({ ...r, m0: r.m[0], m1: r.m[1], m2: r.m[2] });\n    const phaseColors = { 'Month 1': accent, 'Month 2': '#A29889', 'Month 3': '#B39F82' };\n    const taskRows = S.tasks.map((t, idx) => ({\n      idx, phase: t.phase, target: t.target, task: t.task, cost: t.cost, note: t.note,\n      mark: t.done ? '✓' : '', phaseColor: phaseColors[t.phase],\n      rowStyle: `display:flex;gap:18px;align-items:center;padding:13px 20px;border-bottom:1px solid #26221C;${t.done ? 'opacity:0.55;' : ''}`,\n      boxStyle: `width:22px;height:22px;flex-shrink:0;border:1px solid ${t.done ? accent : '#4A443B'};background:${t.done ? accent : 'none'};color:#14110E;cursor:pointer;font-size:14px;line-height:1;padding:0;`,\n      taskColor: t.done ? '#A29889' : '#EDE5D8',\n      taskStyle: t.done ? 'text-decoration:line-through;' : '',\n    }));\n    const ongoingRows = [\n      { label: 'Xero Standard plan', amount: '$780' }, { label: 'Accountant — BAS + annual tax', amount: '$800' },\n      { label: 'ASIC annual review fee', amount: '$310' }, { label: 'Public liability insurance', amount: '$500' },\n      { label: 'Domain + Google Workspace', amount: '$200' },\n    ];\n    const paidBtn = (p) => `margin:6px 8px;border:1px solid ${p ? '#5C6B4E' : '#4A443B'};background:${p ? 'rgba(122,120,87,0.25)' : 'none'};color:${p ? '#A6B08E' : '#A29889'};font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;padding:5px 4px;cursor:pointer;text-transform:uppercase;`;\n    const sideBtn = (s) => `margin:6px 8px;border:1px solid ${s === 'Business' ? '#7A7857' : '#4A443B'};background:none;color:${s === 'Business' ? '#B39F82' : '#A29889'};font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;padding:5px 4px;cursor:pointer;text-transform:uppercase;`;\n    return {\n      tabs, setTab: (e) => this.set({ tab: +e.currentTarget.dataset.tab }),\n      showPlan: S.tab === 0, showOverview: S.tab === 1, showIn: S.tab === 2,\n      showOut: S.tab === 3, showForecast: S.tab === 4, showPty: S.tab === 5,\n      goalTiles, phases, yearMarks, rhythm, statCards, ninetyCards, bars, catRows, activity,\n      ideas: S.ideas, ideaDraft: S.ideaDraft,\n      onIdeaDraft: (e) => this.setState({ ideaDraft: e.target.value }),\n      onIdeaKey: (e) => { if (e.key === 'Enter') this.addIdea(); },\n      addIdea: () => this.addIdea(),\n      removeIdea: (e) => { const i = +e.currentTarget.dataset.i; this.set({ ideas: S.ideas.filter((_, j) => j !== i) }); },\n      taskProgressBig: doneCount + ' / ' + S.tasks.length,\n      taskBarStyle: bar(pct(doneCount, S.tasks.length), accent),\n      setupCost: '$1,897', ongoingCost: '$2,590',\n      nextTask: nextT ? nextT.task : 'All done ✦',\n      goPty: () => this.set({ tab: 5 }),\n      totalInBig: this.money(totalIn), totalOutBig: this.money(totalOut),\n      outPersonal: this.money(outPersonalN), outBusiness: this.money(outBusinessN),\n      moneyIn: S.moneyIn.map(r => ({ ...r, paidLabel: r.paid ? 'Paid ✓' : 'Owed', paidStyle: paidBtn(r.paid) })),\n      onIn: (e) => this.editRow('moneyIn', e), delIn: (e) => this.delRow('moneyIn', e),\n      addIn: () => this.set({ moneyIn: [...S.moneyIn, { date: this.today(), client: '', pkg: '', amount: '', paid: false, notes: '' }] }),\n      togglePaid: (e) => { const i = +e.currentTarget.dataset.i; this.set({ moneyIn: S.moneyIn.map((r, j) => j === i ? { ...r, paid: !r.paid } : r) }); },\n      moneyOut: S.moneyOut.map(r => ({ ...r, sideStyle: sideBtn(r.side) })),\n      onOut: (e) => this.editRow('moneyOut', e), delOut: (e) => this.delRow('moneyOut', e),\n      addOut: () => this.set({ moneyOut: [...S.moneyOut, { date: this.today(), desc: '', amount: '', side: 'Personal', cat: '', notes: '' }] }),\n      toggleSide: (e) => { const i = +e.currentTarget.dataset.i; this.set({ moneyOut: S.moneyOut.map((r, j) => j === i ? { ...r, side: r.side === 'Personal' ? 'Business' : 'Personal' } : r) }); },\n      fcIncome: S.fcIncome.map(mk), fcExpense: S.fcExpense.map(mk),\n      onFc: (e) => {\n        const { g, i, m } = e.currentTarget.dataset;\n        const key = g === 'income' ? 'fcIncome' : 'fcExpense';\n        const list = S[key].map((r, j) => j === +i ? { ...r, m: r.m.map((v, k) => k === +m ? e.target.value : v) } : r);\n        this.set({ [key]: list });\n      },\n      fcIncTotal0: this.money(incT[0]), fcIncTotal1: this.money(incT[1]), fcIncTotal2: this.money(incT[2]),\n      fcExpTotal0: this.money(expT[0]), fcExpTotal1: this.money(expT[1]), fcExpTotal2: this.money(expT[2]),\n      fcNet0: this.money(nets[0]), fcNet1: this.money(nets[1]), fcNet2: this.money(nets[2]),\n      fcNetColor0: nets[0] >= 0 ? '#A6B08E' : '#C9A08A', fcNetColor1: nets[1] >= 0 ? '#A6B08E' : '#C9A08A', fcNetColor2: nets[2] >= 0 ? '#A6B08E' : '#C9A08A',\n      taskRows, ongoingRows,\n      toggleTask: (e) => { const i = +e.currentTarget.dataset.i; this.set({ tasks: S.tasks.map((t, j) => j === i ? { ...t, done: !t.done } : t) }); },\n    };\n  }\n  today() {\n    const d = new Date();\n    return d.getDate().toString().padStart(2, '0') + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + String(d.getFullYear()).slice(2);\n  }\n  addIdea() {\n    const t = this.state.ideaDraft.trim();\n    if (!t) return;\n    this.set({ ideas: [...this.state.ideas, { text: t }], ideaDraft: '' });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
